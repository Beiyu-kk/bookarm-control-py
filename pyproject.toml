[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookarm_control_py"
version = "0.1.0"
description = "Python control package for the book arm robot."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Beiyu" }
]
dependencies = [
    "numpy>=1.26",
    "pin>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
